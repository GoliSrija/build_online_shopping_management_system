<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Management System</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script src="static/js/app.js"></script>
    <style>
        body {
            font-family: 'Roboto Regular', sans-serif;
            background-color: #F6F6F6;
            color: #212529;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer {
            background-color: #343A40;
            color: #F6F6F6;
            padding: 10px;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        nav {
            background-color: #007BFF;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #F6F6F6;
            text-decoration: none;
            margin: 0 10px;
        }
        section.hero {
            background-image: url('static/images/hero.jpg');
            background-size: cover;
            background-position: center;
            color: #F6F6F6;
            padding: 50px;
            text-align: center;
        }
        section.dashboard {
            background-color: #343A40;
            color: #F6F6F6;
            padding: 20px;
        }
        section.dashboard h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        section.dashboard button {
            background-color: #0056b3;
            color: #F6F6F6;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
        }
        section.dashboard button:hover {
            background-color: #004882;
        }
        section.dashboard table {
            width: 100%;
            border-collapse: collapse;
        }
        section.dashboard table th, section.dashboard table td {
            border: 1px solid #343A40;
            padding: 10px;
        }
        section.dashboard table th {
            background-color: #007BFF;
            color: #F6F6F6;
        }
        section.dashboard table tr:nth-child(even) {
            background-color: #343A40;
        }
        section.dashboard table tr:hover {
            background-color: #0056b3;
        }
        section.dashboard .loading-indicator {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        section.dashboard .loading-indicator img {
            margin: 0 auto;
        }
        section.dashboard .loading-indicator p {
            margin: 0;
        }
        footer {
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Online Shopping Management System</h1>
        <nav>
            <a href="#/">Home</a>
            <a href="#/login">Login</a>
            <a href="#/register">Register</a>
            <a href="#/dashboard">Dashboard</a>
            <a href="#/logout">Logout</a>
        </nav>
    </header>
    <main>
        <section class="hero" id="hero">
            <h2>Welcome to our Online Shopping Management System</h2>
            <p>Manage your e-commerce business with ease.</p>
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Register</button>
        </section>
        <section class="dashboard" id="dashboard">
            <h1>Dashboard</h1>
            <button id="generateProjectBtn">Generate Project</button>
            <div class="loading-indicator">
                <img src="static/images/loading.gif" alt="Loading">
                <p>Loading...</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Online Shopping Management System. All rights reserved.</p>
    </footer>
</body>
</html>
