<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Management System</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script src="static/js/app.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f7;
        }
        header, footer {
            background-color: #1976d2;
            color: #ffffff;
            padding: 10px 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #2c3e50;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .hero {
            background-image: linear-gradient(135deg, #1976d2 0%, #2c3e50 100%);
            color: #ffffff;
            padding: 100px 20px;
            text-align: center;
        }
        .login-register-btn {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 20px;
            background-color: #00b8d4;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-register-btn:hover {
            background-color: #0096c7;
        }
        .dashboard-preview {
            background-color: #ffffff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .footer {
            background-color: #1976d2;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <div class="login">
                <a href="#">Login</a>
                <a href="#">Register</a>
            </div>
        </div>
    </header>
    <section class="hero">
        <h1>Welcome to Online Shopping Management System</h1>
        <p>Streamline your online shopping processes with our efficient system.</p>
    </section>
    <section class="login-register-btn-container">
        <button class="login-register-btn" onclick="window.location.href='/login'">Login</button>
        <button class="login-register-btn" onclick="window.location.href='/register'">Register</button>
    </section>
    <section class="dashboard-preview">
        <h2>Dashboard Preview</h2>
        <p>See your orders, manage accounts, and more.</p>
    </section>
    <footer class="footer">
        <p>© 2023 Online Shopping Management System. All rights reserved.</p>
    </footer>
</body>
</html>
